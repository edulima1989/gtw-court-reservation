spring:
  application:
    name: gtw-court-reservation
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: court-redirect
              uri: http://localhost:8081/
              predicates:
                - Path=/courts/**,/courts

            - id: users-redirect
              uri: http://localhost:8082/
              predicates:
                - Path=/users/**,/users

security:
  external-auth:
    validation-url: http://localhost:8082/users/api/auth/validate-session
    protected-paths:
      - /courts/**
      - /users/**
    excluded-paths:
      - /users/api/auth/login
      - /users/api/auth/register
      - /users/swagger-ui/**
      - /users/v3/api-docs/**
      - /courts/swagger-ui/**
      - /courts/api-docs/**